<div class="viewer-overlay">
  <div class="viewer-container" role="dialog" aria-modal="true" [attr.aria-labelledby]="title ? 'viewer-title' : null">

    <header class="viewer-header">
      @if (title) {
        <h2 id="viewer-title" class="viewer-title">{{ title }}</h2>
      }
      <button class="btn-close" (click)="requestClose()" aria-label="Cerrar visor"></button>
    </header>

    <div class="viewer-content">


      @if (isLoading) {
        <div class="status-indicator loading">
          <span></span>
          <span></span>
          <span></span>
        </div>
      }

      @if (hasError && !isLoading) {
        <div class="status-indicator error">
          {{ errorMessage || 'No se pudo cargar el documento.' }}
        </div>
      }

      @if (!isLoading && !hasError) {
        @if (detectedType === 'pdf' && safePdfUrl) {
          <iframe
            [src]="safePdfUrl"
            class="document-iframe"
            frameborder="0"
            (load)="onIframeLoad()"
            (error)="onIframeError()"
            title="Visor de PDF">
            Tu navegador no soporta iframes o la carga del PDF falló.
          </iframe>
        }
        @if (detectedType === 'image' && currentImageUrl) {
          <div
            class="image-container">
            <img [src]="currentImageUrl"
              alt="Visor de imagen"
              class="document-image"
              (load)="onImageLoad()"
              (error)="onImageError()" />
            </div>
          }
        }
      </div>
    </div>
  </div>
