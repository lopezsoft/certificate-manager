<div class="modal-header">
  <h5 class="modal-title">Nuevo secreto del webhook</h5>
  <button type="button" class="btn-close"
    (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body">
  <p class="text-warning fw-semibold">
    <i data-feather="alert-triangle" class="me-1"></i>
    Este secreto solo se muestra <strong>una vez</strong>. Guárdalo ahora.
  </p>

  <div class="input-group">
    <input
      type="text"
      class="form-control font-monospace"
      [value]="secret"
      readonly />
    <button class="btn btn-outline-secondary" type="button"
      (click)="copySecret()">
      {{ copied ? 'Copiado ✓' : 'Copiar' }}
    </button>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-primary"
    (click)="activeModal.close()">Cerrar</button>
</div>
