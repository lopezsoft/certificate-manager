<div class="modal-header bg-transparent pb-0">
  <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body pb-3 px-sm-3">
  <div class="text-center mb-2">
    <div class="avatar bg-light-warning p-2 mb-1">
      <div class="avatar-content">
        <i data-feather="key" class="text-warning" style="width: 32px; height: 32px"></i>
      </div>
    </div>
    <h3 class="mb-1">Secreto HMAC</h3>
    <p class="text-muted mb-0">Utiliza este secreto para verificar criptográficamente las firmas de los webhooks que recibas.</p>
  </div>

  <div class="alert alert-warning p-2 my-2" role="alert">
    <div class="d-flex">
      <div class="alert-icon me-1">
        <i data-feather="alert-triangle"></i>
      </div>
      <div>
        <h6 class="alert-heading text-warning mb-50">¡Copia tu secreto ahora!</h6>
        <div class="alert-body text-dark">
          Por razones estrictas de seguridad, este secreto <strong>no se volverá a mostrar</strong>. Asegúrate de copiarlo y guardarlo en el archivo `.env` de tu servidor inmediatamente.
        </div>
      </div>
    </div>
  </div>

  <div class="mt-2">
    <div class="input-group input-group-merge">
      <span class="input-group-text"><i data-feather="lock"></i></span>
      <input
        type="text"
        class="form-control font-monospace text-primary fw-bold"
        style="letter-spacing: 0.5px;"
        [value]="secret"
        readonly
        (focus)="$event.target.select()" />
      <button class="btn btn-primary" type="button" (click)="copySecret()">
        <span [class.d-none]="copied"><i data-feather="copy" class="me-50"></i> Copiar</span>
        <span [class.d-none]="!copied"><i data-feather="check" class="me-50"></i> Copiado</span>
      </button>
    </div>
  </div>
</div>

<div class="modal-footer justify-content-center bg-light pt-2 pb-2 mt-0 border-0">
  <button type="button" class="btn btn-outline-secondary" (click)="activeModal.close()">
    Ya lo he guardado de forma segura
  </button>
</div>
